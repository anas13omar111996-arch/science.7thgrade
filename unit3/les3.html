<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار العلوم: مملكتا الفطريات والطلائعيات</title>
    <style>
        :root {
            --primary-color: #6a1b9a;
            --accent-color: #00c853;
            --secondary-color: #0288d1;
            --bg-color: #f3e5f5;
            --card-bg: #ffffff;
            --text-color: #263238;
            --error-color: #d32f2f;
            --warning-color: #e65100;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 780px;
            padding: 30px;
            box-sizing: border-box;
        }

        .quiz-header {
            text-align: center;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .quiz-header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin: 0 0 6px 0;
        }

        .quiz-header p {
            color: #546e7a;
            font-size: 0.95rem;
            margin: 4px 0;
        }

        .teacher-tag {
            display: inline-block;
            background-color: #ede7f6;
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
        }

        .header-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }

        .timer-box {
            background-color: #fff3e0;
            color: var(--warning-color);
            border: 2px solid #ffe0b2;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .timer-box.warning {
            background-color: #ffebee;
            color: var(--error-color);
            border-color: #ffcdd2;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        .progress-bar {
            flex-grow: 1;
            background-color: #e0e0e0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            display: none;
        }

        .question-card.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-number {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #cfd8dc;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 1rem;
            text-align: right;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            color: var(--text-color);
        }

        .option-btn:hover:not([disabled]) {
            background-color: #ede7f6;
            border-color: var(--primary-color);
        }

        .option-btn.correct {
            background-color: #e8f5e9 !important;
            border-color: var(--accent-color) !important;
            color: #1b5e20;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #ffebee !important;
            border-color: var(--error-color) !important;
            color: #b71c1c;
        }

        .explanation {
            margin-top: 18px;
            padding: 14px;
            border-radius: 8px;
            background-color: #e3f2fd;
            border-right: 5px solid var(--secondary-color);
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
        }

        .nav-controls {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-next {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 26px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }

        .btn-next:hover {
            background-color: #4a148c;
        }

        .results-card {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            font-size: 2.2rem;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .score-circle span {
            font-size: 0.85rem;
            font-weight: normal;
        }

        .restart-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }

        .restart-btn:hover {
            background-color: #00a142;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="quiz-header">
        <h1>اختبار العلوم التفاعلي 🍄🧫</h1>
        <p>الدرس الثالث: مملكتا الفطريات والطلائعيات (الصف السابع)</p>
        <div class="teacher-tag">إعداد: الأستاذ أنس المزرعاوي</div>
    </div>

    <div class="header-status-bar" id="statusBar">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="timer-box" id="timerBox">
            ⏱️ <span id="timerText">30</span> ثانية
        </div>
    </div>

    <div id="quizBody">
        <!-- الأسئلة سيتم إنشاؤها عبر JavaScript -->
    </div>

    <div class="nav-controls">
        <button class="btn-next" id="nextBtn" onclick="nextQuestion()">السؤال التالي ➔</button>
    </div>

    <div class="results-card" id="resultsCard">
        <h2>أحسنت! أكملت الاختبار بنجاح 🎉</h2>
        <div class="score-circle" id="scoreCircle">
            <div id="scoreText">0/0</div>
            <span>النتيجة النهائية</span>
        </div>
        <p id="resultFeedback" style="font-size: 1.1rem; margin-bottom: 20px; color: #37474f;"></p>
        <button class="restart-btn" onclick="restartQuiz()">إعادة الاختبار 🔄</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "تُعد الفطريات كائنات حية حقيقية النوى، ومعظمها عديدة الخلايا، وتتشابه خلاياها مع خلايا النباتات بوجود:",
            options: [
                "البلاستيدات الخضراء",
                "جدار خلوي (ولكن بتركيب مختلف)",
                "النسيج الوعائي (الخشب واللحاء)",
                "القدرة على صنع الغذاء ذاتياً"
            ],
            correct: 1,
            explanation: "تتشابه خلايا الفطريات مع خلايا النباتات بوجود جدار خلوي، إلا أن تركيبه يختلف بينهما، كما أن الفطريات غير ذاتية التغذية."
        },
        {
            question: "كيف تحصل «الفطريات الرمية» (مثل فطر المشروم) على غذائها في البيئة؟",
            options: [
                "عن طريق عملية البناء الضوئي تماماً كالنباتات",
                "عن طريق التطفل على الإنسان والحيوان مسببة للأمراض",
                "عن طريق تحليل بقايا الكائنات الحية بعد موتها",
                "عن طريق امتصاص الماء لتصنعه الطحالب"
            ],
            correct: 2,
            explanation: "تحصل الفطريات الرمية على غذائها عن طريق تحليل بقايا الكائنات الحية بعد موتها، مما يسهم في الحفاظ على نظافة البيئة وتقليل التلوث[cite: 34]."
        },
        {
            question: "تتغذى بعض الفطريات بما تنتجه الطحالب من غذاء، وفي المقابل تمتص الطحالب الماء والأملاح لها، وتُسمى هذه الفطريات بـ:",
            options: [
                "الفطريات التطفلية",
                "الفطريات الرمية",
                "الفطريات التقاضية (مثل الأشنات)",
                "الفطريات وحيدة الخلية"
            ],
            correct: 2,
            explanation: "الفطريات التقاضية هي التي تعيش بعلاقة تكافلية (تقاضية)، مثل الأشنات؛ حيث تتغذى الفطريات على ما تنتجه الطحالب، وتمتص الماء والأملاح لتساعد الطحالب[cite: 34]."
        },
        {
            question: "أي من الأمراض الآتية تُعتبر الفطريات التطفلية مسؤولة عن إحداثها للإنسان؟",
            options: [
                "مرض الزحار الأميبي وملاريا الدم",
                "سَعْفَةُ الرأس وفطر الأظافر",
                "التهاب الحلق والرشح الفيروسي",
                "السكري وضغط الدم الوراثي"
            ],
            correct: 1,
            explanation: "ترتبط الفطريات التطفلية بعلاقات ممرضة مع الإنسان والحيوان والنبات، ومن الأمثلة عليها سَعْفَةُ الرأس وفطر الأظافر[cite: 34]."
        },
        {
            question: "تُعد «الطلائعيات» أبسط الكائنات الحية:",
            options: [
                "بدائية النواة",
                "حقيقية النوى",
                "العديمة النواة تماماً",
                "فيروسية التركيب"
            ],
            correct: 1,
            explanation: "الطلائعيات هي أبسط الكائنات الحية حقيقية النوى[cite: 36]."
        },
        {
            question: "لجأ العلماء إلى تصنيف الكائنات الحية التي تنتمي إلى «مملكة الطلائعيات» اعتماداً أساسياً على:",
            options: [
                "تركيب المادة الوراثية لاختلاف أوجه التشابه فيما بينها",
                "طريقة حركتها باستخدام الأقدام الكاذبة فقط",
                "حجمها المرئي بالعين المجردة في الماء",
                "قدرتها على العيش على اليابسة الجافة"
            ],
            correct: 0,
            explanation: "وجد العلماء أن أوجه الاختلاف بين الطلائعيات أكثر من أوجه التشابه، فلجأوا إلى تصنيفها اعتماداً على تركيب المادة الوراثية[cite: 36]."
        },
        {
            question: "تُعد «الطحالب» مثالاً على الطلائعيات ذاتية التغذية والمفيدة للإنسان، ومن الاستخدامات العلاجية والصناعية لها:",
            options: [
                "علاج أمراض الفطريات الجلدية وسعفة الرأس",
                "صناعة قوالب الأسنان واستخلاص مكملات غذائية",
                "إنتاج المضادات الحيوية القوية ضد البكتيريا",
                "صناعة الأسمدة الكيماوية للتربة الزراعية"
            ],
            correct: 1,
            explanation: "تُستخلص بعض المركبات من الطحالب لتصنيع مكملات غذائية، أو لأغراض علاجية كصناعة قوالب الأسنان[cite: 36]."
        },
        {
            question: "ما المرض الذي يسببه أحد أنواع «الأميبا» (التي تعد من الأوليات غير ذاتية التغذية) للإنسان؟",
            options: [
                "مرض الزحار الأميبي",
                "مرض فطر الأظافر",
                "مرض سَعْفَةُ الرأس",
                "مرض الكوليرا الحادة"
            ],
            correct: 0,
            explanation: "الأوليات غير ذاتية التغذية قد يسبب بعضها المرض للإنسان، مثل أحد أنواع الأميبا الذي يسبب له مرض الزحار الأميبي[cite: 36]."
        },
        {
            question: "تتشابه الفطريات مع النباتات في وجود جدار خلوي، وتختلف عنها في أن الفطريات:",
            options: [
                "كائنات حية وحيدة الخلية دائماً",
                "كائنات حية غير ذاتية التغذية",
                "كائنات بدائية النواة تماماً",
                "لا تحتوي على أي مادة وراثية"
            ],
            correct: 1,
            explanation: "الفطريات كائنات غير ذاتية التغذية (لا تصنع غذاءها بنفسها)، بينما النباتات كائنات ذاتية التغذية تقوم بالبناء الضوئي[cite: 33, 35]."
        },
        {
            question: "أي الكائنات الآتية يتبع لمجموعة «الأوليات» ضمن مملكة الطلائعيات؟",
            options: [
                "فطر المشروم والأشنات",
                "الأميبا والبراميسيوم",
                "نبات الفيوناريا والخنشار",
                "السرخسيات والصنوبريات"
            ],
            correct: 1,
            explanation: "تعد الأوليات من الأمثلة على الطلائعيات غير ذاتية التغذية، ومنها الأميبا والبراميسيوم[cite: 36]."
        }
    ];

    const QUESTION_TIME_LIMIT = 30;
    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let timeLeft = QUESTION_TIME_LIMIT;
    let timerInterval = null;

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = QUESTION_TIME_LIMIT;
        updateTimerUI();

        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerUI();

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 1000);
    }

    function updateTimerUI() {
        const timerText = document.getElementById('timerText');
        const timerBox = document.getElementById('timerBox');

        timerText.innerText = timeLeft;

        if (timeLeft <= 10) {
            timerBox.classList.add('warning');
        } else {
            timerBox.classList.remove('warning');
        }
    }

    function handleTimeout() {
        if (answered) return;
        answered = true;

        const q = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        const explanation = document.getElementById('explanationText');
        const nextBtn = document.getElementById('nextBtn');

        buttons.forEach(btn => btn.disabled = true);
        buttons[q.correct].classList.add('correct');

        explanation.innerHTML = `⚠️ <strong>انتهى الوقت المحدد للسؤال!</strong><br>${q.explanation}`;
        explanation.style.display = 'block';

        if (currentQuestionIndex < questions.length - 1) {
            nextBtn.innerText = 'السؤال التالي ➔';
        } else {
            nextBtn.innerText = 'عرض النتيجة 🏆';
        }
        nextBtn.style.display = 'block';
    }

    function loadQuestion() {
        answered = false;
        const q = questions[currentQuestionIndex];
        const quizBody = document.getElementById('quizBody');
        const nextBtn = document.getElementById('nextBtn');
        
        nextBtn.style.display = 'none';

        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;

        quizBody.innerHTML = `
            <div class="question-card active">
                <div class="question-number">السؤال ${currentQuestionIndex + 1} من ${questions.length}</div>
                <div class="question-text">${q.question}</div>
                <div class="options-container">
                    ${q.options.map((opt, i) => `
                        <button class="option-btn" onclick="selectOption(${i})">${opt}</button>
                    `).join('')}
                </div>
                <div class="explanation" id="explanationText">${q.explanation}</div>
            </div>
        `;

        startTimer();
    }

    function selectOption(index) {
        if (answered) return;
        answered = true;
        clearInterval(timerInterval);

        const q = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        const explanation = document.getElementById('explanationText');
        const nextBtn = document.getElementById('nextBtn');

        buttons.forEach(btn => btn.disabled = true);

        if (index === q.correct) {
            buttons[index].classList.add('correct');
            score++;
        } else {
            buttons[index].classList.add('incorrect');
            buttons[q.correct].classList.add('correct');
        }

        explanation.style.display = 'block';

        if (currentQuestionIndex < questions.length - 1) {
            nextBtn.innerText = 'السؤال التالي ➔';
        } else {
            nextBtn.innerText = 'عرض النتيجة 🏆';
        }
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('quizBody').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('statusBar').style.display = 'none';

        const resultsCard = document.getElementById('resultsCard');
        const scoreText = document.getElementById('scoreText');
        const feedback = document.getElementById('resultFeedback');

        scoreText.innerText = `${score}/${questions.length}`;
        resultsCard.style.display = 'block';

        const percentage = (score / questions.length) * 100;
        if (percentage >= 90) {
            feedback.innerText = "ممتاز جداً! أداء استثنائي وفهم متكامل لمملكتا الفطريات والطلائعيات 🌟";
        } else if (percentage >= 70) {
            feedback.innerText = "أحسنت! نتيجة رائعة في تصنيف الفطريات والطلائعيات 👍";
        } else if (percentage >= 50) {
            feedback.innerText = "مستوى جيد، مراجعة بسيطة لأنماط التغذية تضمن لك العلامة الكاملة 📘";
        } else {
            feedback.innerText = "ينصح بإعادة قراءة الدرس والتركيز على الفطريات الرمية والتقاضية والتطفلية 🔄";
        }
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('quizBody').style.display = 'block';
        document.getElementById('statusBar').style.display = 'flex';
        document.getElementById('resultsCard').style.display = 'none';
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
