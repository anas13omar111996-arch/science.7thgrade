<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار العلوم: الذائبية ومفهوم المحاليل</title>
    <style>
        :root {
            --primary-color: #0277bd;
            --accent-color: #00c853;
            --secondary-color: #29b6f6;
            --bg-color: #e1f5fe;
            --card-bg: #ffffff;
            --text-color: #263238;
            --error-color: #d32f2f;
            --warning-color: #e65100;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 780px;
            padding: 30px;
            box-sizing: border-box;
        }

        .quiz-header {
            text-align: center;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .quiz-header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin: 0 0 6px 0;
        }

        .quiz-header p {
            color: #546e7a;
            font-size: 0.95rem;
            margin: 4px 0;
        }

        .teacher-tag {
            display: inline-block;
            background-color: #e1f5fe;
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
        }

        .header-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }

        .timer-box {
            background-color: #fff3e0;
            color: var(--warning-color);
            border: 2px solid #ffe0b2;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .timer-box.warning {
            background-color: #ffebee;
            color: var(--error-color);
            border-color: #ffcdd2;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        .progress-bar {
            flex-grow: 1;
            background-color: #e0e0e0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            display: none;
        }

        .question-card.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-number {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #cfd8dc;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 1rem;
            text-align: right;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            color: var(--text-color);
        }

        .option-btn:hover:not([disabled]) {
            background-color: #e1f5fe;
            border-color: var(--primary-color);
        }

        .option-btn.correct {
            background-color: #e8f5e9 !important;
            border-color: var(--accent-color) !important;
            color: #1b5e20;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #ffebee !important;
            border-color: var(--error-color) !important;
            color: #b71c1c;
        }

        .explanation {
            margin-top: 18px;
            padding: 14px;
            border-radius: 8px;
            background-color: #e3f2fd;
            border-right: 5px solid var(--secondary-color);
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
        }

        .nav-controls {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-next {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 26px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }

        .btn-next:hover {
            background-color: #01579b;
        }

        .results-card {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            font-size: 2.2rem;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .score-circle span {
            font-size: 0.85rem;
            font-weight: normal;
        }

        .restart-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }

        .restart-btn:hover {
            background-color: #00a142;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="quiz-header">
        <h1>اختبار العلوم التفاعلي ⚗️📊</h1>
        <p>الدرس الثاني: الذائبية (المحلول، التركيز، والعوامل المؤثرة)</p>
        <div class="teacher-tag">إعداد: الأستاذ أنس المزرعاوي</div>
    </div>

    <div class="header-status-bar" id="statusBar">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="timer-box" id="timerBox">
            ⏱️ <span id="timerText">30</span> ثانية
        </div>
    </div>

    <div id="quizBody">
        <!-- الأسئلة سيتم إنشاؤها عبر JavaScript -->
    </div>

    <div class="nav-controls">
        <button class="btn-next" id="nextBtn" onclick="nextQuestion()">السؤال التالي ➔</button>
    </div>

    <div class="results-card" id="resultsCard">
        <h2>أحسنت! أكملت الاختبار بنجاح 🎉</h2>
        <div class="score-circle" id="scoreCircle">
            <div id="scoreText">0/0</div>
            <span>النتيجة النهائية</span>
        </div>
        <p id="resultFeedback" style="font-size: 1.1rem; margin-bottom: 20px; color: #37474f;"></p>
        <button class="restart-btn" onclick="restartQuiz()">إعادة الاختبار 🔄</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "يُعرَّف «المحلول» بأنه مخلوط متجانس يتكون من مذاب ومذيب، ويكون حجم جسيمات المذاب فيه:",
            options: [
                "كبيراً جداً ويمكن تمييزه بالعين المجردة",
                "صغيراً جداً، ولا يمكن تمييزه بالعين المجردة",
                "متوسطاً ويبقى طافياً على سطح المحلول",
                "متكتلاً على شكل راسب في قعر الكأس"
            ],
            correct: 1,
            explanation: "المحلول مخلوط متجانس يتكون من مذاب ومذيب، ويكون حجم جسيمات المذاب فيه صغيراً جداً، ولا يمكن تمييزه بالعين المجردة[cite: 46]."
        },
        {
            question: "في محلول السكر والماء، تُعرَّف المادة التي تتفكك جسيماتها وتنتشر بين جزيئات المذيب (السكر مثلاً) بأنها:",
            options: [
                "المذيب (Solvent)",
                "المذاب (Solute)",
                "الراسب فوق المشبع",
                "المخلوط غير المتجانس"
            ],
            correct: 1,
            explanation: "المذاب (Solute) هو المادة التي تتفكك جسيماتها بعضها عن بعض، وتنتشر بين جزيئات المذيب[cite: 46]."
        },
        {
            question: "يُعبر عن العلاقة بين كميتي المذاب والمذيب في المحلول باستخدام مفهوم:",
            options: [
                "درجة ذائبية الغازات",
                "تركيز المحلول (Concentration of Solution)",
                "حجم الجسيمات الاهتزازية",
                "الانشطار الثنائي للمذاب"
            ],
            correct: 1,
            explanation: "يُستخدم مفهوم تركيز المحلول للتعبير عن العلاقة بين كميتي المُذاب والمذيب في المحلول[cite: 47]."
        },
        {
            question: "إذا أُذيبت كتلة من المذاب ($m$) قدرها ($10~g$) في حجم محلول ($V$) قدره ($110~mL$)، فإن تركيز المحلول ($C$) يساوي تقريباً:",
            options: [
                "$0.09~g/mL$",
                "$1.10~g/mL$",
                "$11.0~g/mL$",
                "$100~g/mL$"
            ],
            correct: 0,
            explanation: "حساب التركيز ($C = m / V$) يعطي ($10 / 110 = 0.09~g/mL$)[cite: 48]."
        },
        {
            question: "ماذا يُسمى المحلول الذي يصل إلى حد لا يمكنه أن يذيب فيه أي كميات إضافية من المذاب عند درجة حرارة معينة؟",
            options: [
                "المحلول فوق المشبع",
                "المحلول المشبع (Saturated Solution)",
                "المحلول المقطر النقي",
                "المخلوط غير المتجانس"
            ],
            correct: 1,
            explanation: "المحلول المشبع هو المحلول الذي لا يمكنه أن يذيب أي كميات إضافية من المذاب، وتترسب الكمية الإضافية في القعر[cite: 50]."
        },
        {
            question: "تُعرَّف «الذائبية» بأنها أكبر كتلة من المذاب التي تذوب في حجم محدد من الماء قدره:",
            options: [
                "$10~mL$ من الماء",
                "$100~mL$ من الماء",
                "$1000~mL$ من الماء",
                "$1~L$ من المحلول المقطر"
            ],
            correct: 1,
            explanation: "الذائبية هي أكبر كتلة من المذاب التي تذوب في ($100~mL$) من الماء عند درجة حرارة معينة[cite: 50]."
        },
        {
            question: "كيف تؤثر «درجة الحرارة» في ذائبية معظم المواد الصلبة في الماء؟",
            options: [
                "تقل ذائبية المواد الصلبة بانخفاض أو ارتفاع الحرارة",
                "لا توجد أي علاقة بين درجة الحرارة والذائبية",
                "تزداد ذائبية معظم المواد الصلبة في الماء بارتفاع درجة الحرارة",
                "تؤدي لترسب المذاب فوراً بشكل مسحوق خشن"
            ],
            correct: 2,
            explanation: "تزداد ذائبية معظم المواد الصلبة في الماء بارتفاع درجة الحرارة نتيجة زيادة حركة جزيئات الماء وتوسع الفراغات بينها[cite: 50]."
        },
        {
            question: "تزداد سرعة ذوبان المادة الصلبة في الماء عن طريق طحنها وتحويلها إلى مسحوق ناعم؛ لأن ذلك يؤدي إلى:",
            options: [
                "تقليل مساحة سطح المادة المذابة لتلامس كمية أقل من الماء",
                "زيادة مساحة سطح المادة المذابة لتلامس عدداً أكبر من جزيئات الماء",
                "تحويل المادة الصلبة إلى حالة غازية قابلة للانضغاط",
                "خفض درجة حرارة المحلول وتثبيت تركيزه"
            ],
            correct: 1,
            explanation: "تحويل المادة إلى مسحوق يزيد مساحة سطح المادة المذابة فتلامس عدداً أكبر من جزيئات الماء وتزداد سرعة ذوبانها[cite: 51]."
        },
        {
            question: "كيف تتأثر «ذائبية الغازات في الماء» بارتفاع درجة حرارة الماء (مثل تسخينه)؟",
            options: [
                "تزداد ذائبية الغازات وتذوب كميات أكبر",
                "تقل ذائبية الغازات في الماء وتخرج على شكل فقاعات",
                "تتحول الغازات إلى مواد صلبة مترسبة في قعر الكأس",
                "لا تتأثر ذائبية الغازات بدرجة الحرارة إطلاقاً"
            ],
            correct: 1,
            explanation: "تقل ذائبية الغازات في الماء بزيادة درجة الحرارة، ولهذا تظهر فقاعات غازية عند تسخين الماء[cite: 52]."
        },
        {
            question: "ما التأثير الناتج عن «زيادة الضغط» الواقع على غاز مذاب في الماء بالنسبة لذائبيته؟",
            options: [
                "كلما زاد الضغط زادت ذائبية الغاز في الماء",
                "كلما زاد الضغط اَنمحت ذائبية الغاز تماماً",
                "لا يتأثر الغاز المذاب بتغير الضغط الخارجي",
                "يؤدي لارتفاع درجة حرارة المحلول الفوري"
            ],
            correct: 0,
            explanation: "تتأثر ذائبية الغازات بالضغط الواقع عليها؛ فكلما زاد الضغط زادت ذائبية الغاز في الماء عند درجة حرارة معينة[cite: 52]."
        }
    ];

    const QUESTION_TIME_LIMIT = 30;
    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let timeLeft = QUESTION_TIME_LIMIT;
    let timerInterval = null;

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = QUESTION_TIME_LIMIT;
        updateTimerUI();

        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerUI();

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 1000);
    }

    function updateTimerUI() {
        const timerText = document.getElementById('timerText');
        const timerBox = document.getElementById('timerBox');

        timerText.innerText = timeLeft;

        if (timeLeft <= 10) {
            timerBox.classList.add('warning');
        } else {
            timerBox.classList.remove('warning');
        }
    }

    function handleTimeout() {
        if (answered) return;
        answered = true;

        const q = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        const explanation = document.getElementById('explanationText');
        const nextBtn = document.getElementById('nextBtn');

        buttons.forEach(btn => btn.disabled = true);
        buttons[q.correct].classList.add('correct');

        explanation.innerHTML = `⚠️ <strong>انتهى الوقت المحدد للسؤال!</strong><br>${q.explanation}`;
        explanation.style.display = 'block';

        if (currentQuestionIndex < questions.length - 1) {
            nextBtn.innerText = 'السؤال التالي ➔';
        } else {
            nextBtn.innerText = 'عرض النتيجة 🏆';
        }
        nextBtn.style.display = 'block';
    }

    function loadQuestion() {
        answered = false;
        const q = questions[currentQuestionIndex];
        const quizBody = document.getElementById('quizBody');
        const nextBtn = document.getElementById('nextBtn');
        
        nextBtn.style.display = 'none';

        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;

        quizBody.innerHTML = `
            <div class="question-card active">
                <div class="question-number">السؤال ${currentQuestionIndex + 1} من ${questions.length}</div>
                <div class="question-text">${q.question}</div>
                <div class="options-container">
                    ${q.options.map((opt, i) => `
                        <button class="option-btn" onclick="selectOption(${i})">${opt}</button>
                    `).join('')}
                </div>
                <div class="explanation" id="explanationText">${q.explanation}</div>
            </div>
        `;

        startTimer();
    }

    function selectOption(index) {
        if (answered) return;
        answered = true;
        clearInterval(timerInterval);

        const q = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        const explanation = document.getElementById('explanationText');
        const nextBtn = document.getElementById('nextBtn');

        buttons.forEach(btn => btn.disabled = true);

        if (index === q.correct) {
            buttons[index].classList.add('correct');
            score++;
        } else {
            buttons[index].classList.add('incorrect');
            buttons[q.correct].classList.add('correct');
        }

        explanation.style.display = 'block';

        if (currentQuestionIndex < questions.length - 1) {
            nextBtn.innerText = 'السؤال التالي ➔';
        } else {
            nextBtn.innerText = 'عرض النتيجة 🏆';
        }
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('quizBody').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('statusBar').style.display = 'none';

        const resultsCard = document.getElementById('resultsCard');
        const scoreText = document.getElementById('scoreText');
        const feedback = document.getElementById('resultFeedback');

        scoreText.innerText = `${score}/${questions.length}`;
        resultsCard.style.display = 'block';

        const percentage = (score / questions.length) * 100;
        if (percentage >= 90) {
            feedback.innerText = "ممتاز جداً! أداء استثنائي وفهم متكامل لمفاهيم الذائبية والمحاليل العميقة 🌟";
        } else if (percentage >= 70) {
            feedback.innerText = "أحسنت! نتيجة رائعة وفهم قوي للعوامل المؤثرة في الذوبان والتركيز 👍";
        } else if (percentage >= 50) {
            feedback.innerText = "مستوى جيد، مراجعة بسيطة لحسابات التركيز وعوامل الحرارة تضمن لك العلامة الكاملة 📘";
        } else {
            feedback.innerText = "ينصح بإعادة قراءة الدرس والتركيز على المحلول المشبع وذائبية الغازات 🔄";
        }
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('quizBody').style.display = 'block';
        document.getElementById('statusBar').style.display = 'flex';
        document.getElementById('resultsCard').style.display = 'none';
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
