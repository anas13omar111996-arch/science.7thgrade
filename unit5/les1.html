<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار العلوم: وصف الحركة</title>
    <style>
        :root {
            --primary-color: #0d47a1;
            --accent-color: #00c853;
            --secondary-color: #1976d2;
            --bg-color: #e3f2fd;
            --card-bg: #ffffff;
            --text-color: #263238;
            --error-color: #d32f2f;
            --warning-color: #e65100;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 780px;
            padding: 30px;
            box-sizing: border-box;
        }

        .quiz-header {
            text-align: center;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .quiz-header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin: 0 0 6px 0;
        }

        .quiz-header p {
            color: #546e7a;
            font-size: 0.95rem;
            margin: 4px 0;
        }

        .teacher-tag {
            display: inline-block;
            background-color: #e3f2fd;
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
        }

        .header-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }

        .timer-box {
            background-color: #fff3e0;
            color: var(--warning-color);
            border: 2px solid #ffe0b2;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .timer-box.warning {
            background-color: #ffebee;
            color: var(--error-color);
            border-color: #ffcdd2;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        .progress-bar {
            flex-grow: 1;
            background-color: #e0e0e0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            display: none;
        }

        .question-card.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-number {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #cfd8dc;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 1rem;
            text-align: right;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            color: var(--text-color);
        }

        .option-btn:hover:not([disabled]) {
            background-color: #e3f2fd;
            border-color: var(--primary-color);
        }

        .option-btn.correct {
            background-color: #e8f5e9 !important;
            border-color: var(--accent-color) !important;
            color: #1b5e20;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #ffebee !important;
            border-color: var(--error-color) !important;
            color: #b71c1c;
        }

        .explanation {
            margin-top: 18px;
            padding: 14px;
            border-radius: 8px;
            background-color: #e3f2fd;
            border-right: 5px solid var(--secondary-color);
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
        }

        .nav-controls {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-next {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 26px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }

        .btn-next:hover {
            background-color: #0a3880;
        }

        .results-card {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            font-size: 2.2rem;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .score-circle span {
            font-size: 0.85rem;
            font-weight: normal;
        }

        .restart-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }

        .restart-btn:hover {
            background-color: #00a142;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="quiz-header">
        <h1>اختبار العلوم التفاعلي 🚗📏</h1>
        <p>الدرس: وصف الحركة (الموقع، المسافة، الإزاحة، والسرعة)</p>
        <div class="teacher-tag">إعداد: الأستاذ أنس المزرعاوي</div>
    </div>

    <div class="header-status-bar" id="statusBar">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="timer-box" id="timerBox">
            ⏱️ <span id="timerText">30</span> ثانية
        </div>
    </div>

    <div id="quizBody">
        <!-- الأسئلة سيتم إنشاؤها عبر JavaScript -->
    </div>

    <div class="nav-controls">
        <button class="btn-next" id="nextBtn" onclick="nextQuestion()">السؤال التالي ➔</button>
    </div>

    <div class="results-card" id="resultsCard">
        <h2>أحسنت! أكملت الاختبار بنجاح 🎉</h2>
        <div class="score-circle" id="scoreCircle">
            <div id="scoreText">0/0</div>
            <span>النتيجة النهائية</span>
        </div>
        <p id="resultFeedback" style="font-size: 1.1rem; margin-bottom: 20px; color: #37474f;"></p>
        <button class="restart-btn" onclick="restartQuiz()">إعادة الاختبار 🔄</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "يُعرَّف «الموقع (Position)» في الفيزياء بأنه بعد الجسم عن نقطة الإسناد (النقطة المرجعية) باتجاه محدد، ويتم تحديد موقع الجسم دائماً بالنسبة لـ:",
            options: [
                "السرعة المتجهة المتوسطة للجسم",
                "نقطة إسناد مرجعية (Reference Point)",
                "الإزاحة الكلية التي يقطعها الجسم",
                "المسافة الزمانية المستغرقة"
            ],
            correct: 1,
            explanation: "لتحديد موقع جسم يلزمنا نقطة مرجعية نستند إليها تُسمى نقطة الإسناد (Reference Point)."
        },
        {
            question: "تُعرَّف «المسافة (Distance)» بأنها الطول الكلي للمسار الذي يسلكه الجسم أثناء انتقاله بين موقعين، وتُعتبر كمية:",
            options: [
                "متجهة تُحدد بالمقدار والاتجاه معاً",
                "قياسية تُحدد بالمقدار فقط",
                "نسبية تعتمد على اتجاه الشرق فقط",
                "دائرية دائماً ومساوية للإزاحة"
            ],
            correct: 1,
            explanation: "المسافة كمية قياسية؛ أي إنّه يكفي لتحديدها معرفة مقدارها فقط دون الحاجة للاتجاه."
        },
        {
            question: "تُعرَّف «الإزاحة (Displacement)» بأنها أقصر مسار مستقيم يصل بين نقطة بداية الحركة ونهايتها، وتُعد كمية متجهة؛ مما يعني أنها تحسب بالعلاقة:",
            options: [
                "S = طول المسار الفعلي الكلي",
                "Δx = x<sub>b</sub> - x_a (الموقع النهائي - الموقع الابتدائي)",
                "v = s / t",
                "Δt = t_b - t_a"
            ],
            correct: 1,
            explanation: "تُحسب الإزاحة للجسم المتحرك بخط مستقيم بالفرق بين الموقع النهائي والموقع الابتدائي: Δx = x_b - x_a[cite: 49]."
        },
        {
            question: "تحرك عليّ في مسار مغلق مربع الشكل طول ضلعه 50m، ثم عاد إلى الموقع نفسه الذي بدأ منه الحركة؛ فإن مقدار المسافة (s) والإزاحة (Δx) هما:",
            options: [
                "المسافة = 200m، والإزاحة = 0m",
                "المسافة = 0m، والإزاحة = 200m",
                "المسافة = 50m، والإزاحة = 50m",
                "المسافة = 200m، والإزاحة = 50m"
            ],
            correct: 0,
            explanation: "المسافة هي طول المسار الفعلي (50 × 4 = 200m)، بينما الإزاحة تساوي صفراً لأن نقطة النهاية هي نفسها نقطة البداية[cite: 49, 50]."
        },
        {
            question: "تُحسب «السرعة القياسية المتوسطة (Average Speed)» بقسمة المسافة الكلية المقطوعة (s) على الزمن الكلي (t)، وتُقاس بوحدة:",
            options: [
                "متر × ثانية (m·s)",
                "متر لكل ثانية (m/s) أو (km/h)",
                "كيلوغرام لكل متر (kg/m)",
                "ثانية لكل متر (s/m)"
            ],
            correct: 1,
            explanation: "تقاس السرعة (سواء القياسية أو المتجهة) بوحدة متر لكل ثانية (m/s) أو كيلومتر لكل ساعة (km/h)[cite: 50, 51]."
        },
        {
            question: "الفرق الأساسي بين السرعة القياسية والسرعة المتجهة هو أن «السرعة المتجهة المتوسطة» تحسب بقسمة:",
            options: [
                "المسافة الكلية على الزمن الكلي دون اتجاه",
                "الإزاحة المتحققة (Δx) على الزمن المستغرق (Δt) وتحدد بالمقدار والاتجاه",
                "السرعة الأولية على السرعة النهائية",
                "طول المسار الدائري على الكتلة"
            ],
            correct: 1,
            explanation: "السرعة المتجهة المتوسطة تُحدد بالمقدار والاتجاه وتحسب بقسمة الإزاحة (Δx) على المدة الزمنية (Δt)[cite: 51]."
        },
        {
            question: "تكون حركة الجسم «بسرعة ثابتة» عندما يقطع الجسم:",
            options: [
                "مسافات غير متساوية في أزمنة متساوية",
                "مسافات متساوية في أزمنة متساوية",
                "إزاحات متغيرة متزايدة باستمرار",
                "مسارات دائرية فقط في اتجاه الشمال"
            ],
            correct: 1,
            explanation: "عندما يقطع الجسم مسافات متساوية في أزمنة متساوية تكون سرعته ثابتة[cite: 51]."
        },
        {
            question: "كم المسافة (s) التي تقطعها سيارة تتحرك بسرعة ثابتة مقدارها (12m/s) خلال زمن قدره (10 دقائق / 600 ثانية)؟",
            options: [
                "120m",
                "1200m",
                "7200m",
                "600m"
            ],
            correct: 2,
            explanation: "باستخدام القانون s = v × t؛ يتم تحويل 10 دقائق إلى ثوانٍ (10 × 60 = 600s)، ثم الضرب: s = 12 × 600 = 7200m[cite: 52]."
        },
        {
            question: "عند تمثيل حركة جسم على منحنى (الموقع - الزمن)، وكان الرسم البياني عبارة عن خط مستقيم أفقي موازٍ لمور الزمن (ثبات الموقع)، فهذا يدل على أن الجسم:",
            options: [
                "يتتحرك بسرعة ثابتة وسريعة جداً",
                "متوقف عن الحركة (سرعته تساوي صفراً)",
                "يتسارع باستمرار نحو الشرق",
                "يقطع مسافات متساوية في أزمنة متساوية"
            ],
            correct: 1,
            explanation: "الخط المستقيم الأفقي في منحنى (الموقع - الزمن) يعني أن موقع الجسم ثابت مع مرور الزمن، أي إنه متوقف عن الحركة[cite: 53]."
        },
        {
            question: "في سباق سعى فيه حاج بين الصفا والمروة قاطعاً 7 أشواط بمسافة كليّة 2765m، إذا كان المسار مستقيماً بين الموقعين بقطع 395m في الشوط الواحد؛ فما القيمة التقريبية لإزاحته الكلية في نهاية الشوط السابع؟",
            options: [
                "2765m باتجاه المروة",
                "395m باتجاه المروة",
                "0m (صفر)",
                "790m باتجاه الصفا"
            ],
            correct: 1,
            explanation: "بما أنه بدأ من الصفا وانتهى بالمروة بعد 7 أشواط (عدد فردي من الأشواط)، فإن إزاحته الكلية هي المسافة المستقيمة بين البداية والنهاية وتساوي 395m باتجاه المروة[cite: 50]."
        }
    ];

    const QUESTION_TIME_LIMIT = 30;
    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let timeLeft = QUESTION_TIME_LIMIT;
    let timerInterval = null;

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = QUESTION_TIME_LIMIT;
        updateTimerUI();

        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerUI();

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 1000);
    }

    function updateTimerUI() {
        const timerText = document.getElementById('timerText');
        const timerBox = document.getElementById('timerBox');

        timerText.innerText = timeLeft;

        if (timeLeft <= 10) {
            timerBox.classList.add('warning');
        } else {
            timerBox.classList.remove('warning');
        }
    }

    function handleTimeout() {
        if (answered) return;
        answered = true;

        const q = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        const explanation = document.getElementById('explanationText');
        const nextBtn = document.getElementById('nextBtn');

        buttons.forEach(btn => btn.disabled = true);
        buttons[q.correct].classList.add('correct');

        explanation.innerHTML = `⚠️ <strong>انتهى الوقت المحدد للسؤال!</strong><br>${q.explanation}`;
        explanation.style.display = 'block';

        if (currentQuestionIndex < questions.length - 1) {
            nextBtn.innerText = 'السؤال التالي ➔';
        } else {
            nextBtn.innerText = 'عرض النتيجة 🏆';
        }
        nextBtn.style.display = 'block';
    }

    function loadQuestion() {
        answered = false;
        const q = questions[currentQuestionIndex];
        const quizBody = document.getElementById('quizBody');
        const nextBtn = document.getElementById('nextBtn');
        
        nextBtn.style.display = 'none';

        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;

        quizBody.innerHTML = `
            <div class="question-card active">
                <div class="question-number">السؤال ${currentQuestionIndex + 1} من ${questions.length}</div>
                <div class="question-text">${q.question}</div>
                <div class="options-container">
                    ${q.options.map((opt, i) => `
                        <button class="option-btn" onclick="selectOption(${i})">${opt}</button>
                    `).join('')}
                </div>
                <div class="explanation" id="explanationText">${q.explanation}</div>
            </div>
        `;

        startTimer();
    }

    function selectOption(index) {
        if (answered) return;
        answered = true;
        clearInterval(timerInterval);

        const q = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        const explanation = document.getElementById('explanationText');
        const nextBtn = document.getElementById('nextBtn');

        buttons.forEach(btn => btn.disabled = true);

        if (index === q.correct) {
            buttons[index].classList.add('correct');
            score++;
        } else {
            buttons[index].classList.add('incorrect');
            buttons[q.correct].classList.add('correct');
        }

        explanation.style.display = 'block';

        if (currentQuestionIndex < questions.length - 1) {
            nextBtn.innerText = 'السؤال التالي ➔';
        } else {
            nextBtn.innerText = 'عرض النتيجة 🏆';
        }
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('quizBody').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('statusBar').style.display = 'none';

        const resultsCard = document.getElementById('resultsCard');
        const scoreText = document.getElementById('scoreText');
        const feedback = document.getElementById('resultFeedback');

        scoreText.innerText = `${score}/${questions.length}`;
        resultsCard.style.display = 'block';

        const percentage = (score / questions.length) * 100;
        if (percentage >= 90) {
            feedback.innerText = "ممتاز جداً! أداء استثنائي وفهم متكامل لمفاهيم وصف الحركة والحسابات الرياضية 🌟";
        } else if (percentage >= 70) {
            feedback.innerText = "أحسنت! أداء رائع وفهم قوي للفرق بين المسافة والإزاحة والسرعة المتجهة 👍";
        } else if (percentage >= 50) {
            feedback.innerText = "مستوى جيد، مراجعة بسيطة لقوانين السرعة والتحويل بين الدقائق والثواني تضمن لك العلامة الكاملة 📘";
        } else {
            feedback.innerText = "ينصح بإعادة قراءة الدرس والتركيز على مفاهيم الإزاحة ومنحنى (الموقع - الزمن) 🔄";
        }
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('quizBody').style.display = 'block';
        document.getElementById('statusBar').style.display = 'flex';
        document.getElementById('resultsCard').style.display = 'none';
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
