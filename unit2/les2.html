<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار العلوم: الدورية في النظام الشمسي</title>
    <style>
        :root {
            --primary-color: #1a237e;
            --accent-color: #00c853;
            --secondary-color: #0288d1;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #263238;
            --error-color: #d32f2f;
            --warning-color: #e65100;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 780px;
            padding: 30px;
            box-sizing: border-box;
        }

        .quiz-header {
            text-align: center;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .quiz-header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin: 0 0 6px 0;
        }

        .quiz-header p {
            color: #546e7a;
            font-size: 0.95rem;
            margin: 4px 0;
        }

        .teacher-tag {
            display: inline-block;
            background-color: #e8eaf6;
            color: var(--primary-color);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
        }

        .header-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
        }

        .timer-box {
            background-color: #fff3e0;
            color: var(--warning-color);
            border: 2px solid #ffe0b2;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .timer-box.warning {
            background-color: #ffebee;
            color: var(--error-color);
            border-color: #ffcdd2;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.04); }
            100% { transform: scale(1); }
        }

        .progress-bar {
            flex-grow: 1;
            background-color: #e0e0e0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--secondary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            display: none;
        }

        .question-card.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-number {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #cfd8dc;
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 1rem;
            text-align: right;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            color: var(--text-color);
        }

        .option-btn:hover:not([disabled]) {
            background-color: #e1f5fe;
            border-color: var(--secondary-color);
        }

        .option-btn.correct {
            background-color: #e8f5e9 !important;
            border-color: var(--accent-color) !important;
            color: #1b5e20;
            font-weight: bold;
        }

        .option-btn.incorrect {
            background-color: #ffebee !important;
            border-color: var(--error-color) !important;
            color: #b71c1c;
        }

        .explanation {
            margin-top: 18px;
            padding: 14px;
            border-radius: 8px;
            background-color: #e1f5fe;
            border-right: 5px solid var(--secondary-color);
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
        }

        .nav-controls {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        .btn-next {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 26px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }

        .btn-next:hover {
            background-color: #0d47a1;
        }

        .results-card {
            text-align: center;
            display: none;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            font-size: 2.2rem;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .score-circle span {
            font-size: 0.85rem;
            font-weight: normal;
        }

        .restart-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }

        .restart-btn:hover {
            background-color: #00a142;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="quiz-header">
        <h1>اختبار العلوم التفاعلي 🌙☀️</h1>
        <p>الدرس الثاني: الدورية في النظام الشمسي (أطوار القمر، الكسوف، الخسوف، والمد والجزر)</p>
        <div class="teacher-tag">إعداد: الأستاذ أنس المزرعاوي</div>
    </div>

    <div class="header-status-bar" id="statusBar">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="timer-box" id="timerBox">
            ⏱️ <span id="timerText">30</span> ثانية
        </div>
    </div>

    <div id="quizBody">
        <!-- الأسئلة سيتم إنشاؤها عبر JavaScript -->
    </div>

    <div class="nav-controls">
        <button class="btn-next" id="nextBtn" onclick="nextQuestion()">السؤال التالي ➔</button>
    </div>

    <div class="results-card" id="resultsCard">
        <h2>أحسنت! أكملت الاختبار بنجاح 🎉</h2>
        <div class="score-circle" id="scoreCircle">
            <div id="scoreText">0/0</div>
            <span>النتيجة النهائية</span>
        </div>
        <p id="resultFeedback" style="font-size: 1.1rem; margin-bottom: 20px; color: #37474f;"></p>
        <button class="restart-btn" onclick="restartQuiz()">إعادة الاختبار 🔄</button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "يحتاج القمر ليظهر بأطواره جميعها إلى مدة تتراوح بين (29 - 30) يوماً وتُسمّى هذه المدة بـ:",
            options: [
                "السنة الشمسية",
                "الشهر القمري",
                "الدورة اليومية",
                "الفصل الفلكي"
            ],
            correct: 1,
            explanation: "تسمى المدة التي يحتاجها القمر ليظهر بأطواره كافة (29-30 يوماً) بالشهر القمري."
        },
        {
            question: "عندما يكون القمر بين الأرض والشمس ولا نستطيع رؤيته لأن الجزء المُضاء منه يكون مواجهاً للشمس، يكون في طور:",
            options: ["البدر", "التربيع الأول", "المحاق", "الأحدب الثاني"],
            correct: 2,
            explanation: "تبدأ أطوار القمر بطور المحاق عندما يقع القمر بين الأرض والشمس فلا نراه."
        },
        {
            question: "تحدث ظاهرة «كسوف الشمس» عندما يكون القمر في طور المحاق، ويكون الكسوف كلياً في المنطقة التي تسمى:",
            options: ["منطقة شبه الظل", "منطقة الظل", "منطقة مدار القمر", "منطقة خط الاستواء"],
            correct: 1,
            explanation: "يكون الكسوف كلياً عندما نحجب الشمس تماماً في منطقة 'الظل'، بينما يُسمى كسوفاً جزئياً في منطقة 'شبه الظل'."
        },
        {
            question: "تحدث ظاهرة «خسوف القمر» عندما تقع الأرض بين الشمس والقمر على استقامة واحدة، ويكون القمر حينها في طور:",
            options: ["المحاق", "الهلال الجديد", "التربيع الثاني", "البدر"],
            correct: 3,
            explanation: "حدث خسوف القمر عندما تحجب الأرض أشعة الشمس عن القمر حينما يكون القمر في طور البدر."
        },
        {
            question: "تحدث ظاهرتا المد والجزر بتأثير قوّتي جذب القمر والشمس في مياه المحيطات، وتؤثر جاذبية القمر بشكل أكبر لأن القمر:",
            options: [
                "أكبر حليماً من الشمس",
                "أقرب إلى الأرض من الشمس",
                "أكثر حرارة من الشمس",
                "يدور أسرع حول الأرض"
            ],
            correct: 1,
            explanation: "تؤثر جاذبية القمر بشكل أكبر في مياه المحيطات نظراً لقربه الشديد من الأرض مقارنة بالشمس."
        },
        {
            question: "كم عدد مرات حدوث ظاهرتي المد والجزر التي تتعرض لها المناطق الساحلية في اليوم الواحد؟",
            options: [
                "مَدّ واحد وجَزْر واحد",
                "مَدّان وجَزْران",
                "ثلاثة أمداد وثلاثة أجزاز",
                "مد واحد وجزران"
            ],
            correct: 1,
            explanation: "يحدث في اليوم الواحد مدّان وجزران بسبب دوران الأرض وتغير موضع القمر."
        },
        {
            question: "يصل المد إلى ارتفاعه الأقصى (أعلى مد) عندما تقع الشمس والأرض والقمر على استقامة واحدة، وذلك في طوري:",
            options: [
                "التربيع الأول والتربيع الثاني",
                "المحاق والبدر",
                "الهلال الجديد والأحدب الأول",
                "البدر والتربيع الأول"
            ],
            correct: 1,
            explanation: "يبلغ المد ارتفاعه الأقصى عندما تكون الأجرام الثلاثة على استقامة واحدة في طوري المحاق والبدر."
        },
        {
            question: "يحدث «أدنى مد» عندما تُشكّل كل من الشمس والأرض والقمر زاوية مقدارها 90 درجة، ويكون القمر في طوري:",
            options: [
                "المحاق والبدر",
                "الهلال الجديد والهلال الأخير",
                "التربيع الأول والتربيع الثاني",
                "الأحدب الأول والأحدب الثاني"
            ],
            correct: 2,
            explanation: "يحدث أدنى مد حين تشكل الشمس والأرض والقمر زاوية 90 درجة، وذلك في طوري التربيع الأول والتربيع الثاني."
        },
        {
            question: "الترتيب الصحيح لظهور أطوار القمر بدءاً من بداية الشهر القمري هو:",
            options: [
                "محاق ➔ هلال جديد ➔ تربيع أول ➔ احدب أول ➔ بدر",
                "بدر ➔ محاق ➔ تربيع أول ➔ هلال جديد",
                "تربيع أول ➔ محاق ➔ بدر ➔ هلال أخير",
                "هلال جديد ➔ بدر ➔ محاق ➔ تربيع ثاني"
            ],
            correct: 0,
            explanation: "يبدأ الشهر بـ المحاق، ثم هلال جديد، ثم تربيع أول، ثم أحدب أول، ثم يكتمل بدراً."
        },
        {
            question: "إذا علمت أن السنة القمرية تتكون من 12 شهراً قمرياً مدة كل منها (29-30 يوماً)، فإن عدد أيام السنة القمرية التقريبي يتراوح بين:",
            options: [
                "300 - 310 أيام",
                "354 - 355 يوماً",
                "365 - 366 يوماً",
                "380 - 390 يوماً"
            ],
            correct: 1,
            explanation: "حسابياً: (12 × 29.5 يوم) ≈ 354 إلى 355 يوماً، وهو مجموع أيام السنة الهجرية (القمرية)."
        }
    ];

    const QUESTION_TIME_LIMIT = 30;
    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let timeLeft = QUESTION_TIME_LIMIT;
    let timerInterval = null;

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = QUESTION_TIME_LIMIT;
        updateTimerUI();

        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerUI();

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 1000);
    }

    function updateTimerUI() {
        const timerText = document.getElementById('timerText');
        const timerBox = document.getElementById('timerBox');

        timerText.innerText = timeLeft;

        if (timeLeft <= 10) {
            timerBox.classList.add('warning');
        } else {
            timerBox.classList.remove('warning');
        }
    }

    function handleTimeout() {
        if (answered) return;
        answered = true;

        const q = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        const explanation = document.getElementById('explanationText');
        const nextBtn = document.getElementById('nextBtn');

        buttons.forEach(btn => btn.disabled = true);
        buttons[q.correct].classList.add('correct');

        explanation.innerHTML = `⚠️ <strong>انتهى الوقت المحدد للسؤال!</strong><br>${q.explanation}`;
        explanation.style.display = 'block';

        if (currentQuestionIndex < questions.length - 1) {
            nextBtn.innerText = 'السؤال التالي ➔';
        } else {
            nextBtn.innerText = 'عرض النتيجة 🏆';
        }
        nextBtn.style.display = 'block';
    }

    function loadQuestion() {
        answered = false;
        const q = questions[currentQuestionIndex];
        const quizBody = document.getElementById('quizBody');
        const nextBtn = document.getElementById('nextBtn');
        
        nextBtn.style.display = 'none';

        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;

        quizBody.innerHTML = `
            <div class="question-card active">
                <div class="question-number">السؤال ${currentQuestionIndex + 1} من ${questions.length}</div>
                <div class="question-text">${q.question}</div>
                <div class="options-container">
                    ${q.options.map((opt, i) => `
                        <button class="option-btn" onclick="selectOption(${i})">${opt}</button>
                    `).join('')}
                </div>
                <div class="explanation" id="explanationText">${q.explanation}</div>
            </div>
        `;

        startTimer();
    }

    function selectOption(index) {
        if (answered) return;
        answered = true;
        clearInterval(timerInterval);

        const q = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        const explanation = document.getElementById('explanationText');
        const nextBtn = document.getElementById('nextBtn');

        buttons.forEach(btn => btn.disabled = true);

        if (index === q.correct) {
            buttons[index].classList.add('correct');
            score++;
        } else {
            buttons[index].classList.add('incorrect');
            buttons[q.correct].classList.add('correct');
        }

        explanation.style.display = 'block';

        if (currentQuestionIndex < questions.length - 1) {
            nextBtn.innerText = 'السؤال التالي ➔';
        } else {
            nextBtn.innerText = 'عرض النتيجة 🏆';
        }
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        clearInterval(timerInterval);
        document.getElementById('quizBody').style.display = 'none';
        document.getElementById('nextBtn').style.display = 'none';
        document.getElementById('statusBar').style.display = 'none';

        const resultsCard = document.getElementById('resultsCard');
        const scoreText = document.getElementById('scoreText');
        const feedback = document.getElementById('resultFeedback');

        scoreText.innerText = `${score}/${questions.length}`;
        resultsCard.style.display = 'block';

        const percentage = (score / questions.length) * 100;
        if (percentage >= 90) {
            feedback.innerText = "ممتاز جداً! أداء استثنائي وفهم عميق للظواهر الفلكية 🌟";
        } else if (percentage >= 70) {
            feedback.innerText = "أحسنت! نتيجة رائعة في أطوار القمر والمد والجزر 👍";
        } else if (percentage >= 50) {
            feedback.innerText = "مستوى جيد، مراجعة بسيطة لمواضع الكسوف والخسوف تضمن لك العلامة الكاملة 📘";
        } else {
            feedback.innerText = "ينصح بإعادة قراءة الدرس والتركيز على أطوار القمر وأسباب حدوث أعلى وأدنى مد 🔄";
        }
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('quizBody').style.display = 'block';
        document.getElementById('statusBar').style.display = 'flex';
        document.getElementById('resultsCard').style.display = 'none';
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
